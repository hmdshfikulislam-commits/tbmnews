  <desc id="description">আপনার বিজ্ঞাপনের ছবি এখানে বসান</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fda4af"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="440" fill="url(#background)"/>
  <circle cx="1010" cy="90" r="210" fill="#fff" opacity=".06"/>
  <circle cx="1090" cy="390" r="250" fill="#fff" opacity=".05"/>
  <path d="M0 355c170-95 275-5 420-68 124-54 202-37 326 16v137H0z" fill="#fff" opacity=".06"/>
