  <text x="108" y="242" fill="#fff" font-family="sans-serif" font-size="58" font-weight="700">আপনার ব্র্যান্ড এখানে</text>
  <text x="112" y="300" fill="#e2e8f0" font-family="sans-serif" font-size="26">বিজ্ঞাপন এলে এই নমুনা ছবিটি বদলে দিন</text>
